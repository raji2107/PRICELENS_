<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}PriceLens{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

    /* ==============================
       DESIGN TOKENS
    ============================== */

    :root {
        --pl-void: #05060f;
        --pl-purple: #8b5cf6;
        --pl-violet: #7c3aed;
        --pl-blue: #2563eb;
        --pl-cyan: #1d4ed8;
        --pl-cyan-bright: #3b82f6;
        --pl-pink: #6d28d9;
        --pl-magenta: #7c3aed;
        --pl-glow: 0 0 30px rgba(139, 92, 246, .35);
        --pl-font-display: "Space Grotesk", "Segoe UI", Arial, sans-serif;
        --pl-font-body: "Inter", "Segoe UI", Arial, sans-serif;
    }


    /* ==============================
       RESET
    ============================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
    }

    html {
        scroll-behavior: smooth;
        background-color: var(--pl-void);
    }

    body {
        font-family: var(--pl-font-body), "Segoe UI", Arial, sans-serif;
        background: var(--pl-void);
        color: #f8fafc;
        overflow-x: hidden;
        position: relative;
        isolation: isolate;
        font-size: 15px;
        line-height: 1.6;
    }


    /* ==============================
       ANIMATED AURORA BACKDROP
       (site-wide, sits behind every page)
    ============================== */

    body::before {
        content: "";
        position: fixed;
        inset: -10%;
        z-index: -3;
        pointer-events: none;

        background:
            radial-gradient(circle at 12% 18%, rgba(139, 92, 246, .32), transparent 38%),
            radial-gradient(circle at 85% 12%, rgba(29, 78, 216, .26), transparent 36%),
            radial-gradient(circle at 78% 88%, rgba(109, 40, 217, .20), transparent 34%),
            radial-gradient(circle at 15% 85%, rgba(37, 99, 235, .24), transparent 36%);

        filter: blur(10px) saturate(130%);

        animation: auroraDrift 22s ease-in-out infinite alternate;
    }

    body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        opacity: .05;

        background-image:
            linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
        background-size: 64px 64px;

        mask-image: radial-gradient(circle at 50% 0%, black, transparent 75%);
    }

    @keyframes auroraDrift {
        0%   { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
        50%  { transform: translate3d(-2%, 2%, 0) scale(1.08) rotate(3deg); }
        100% { transform: translate3d(2%, -1%, 0) scale(1.04) rotate(-2deg); }
    }

    @media (prefers-reduced-motion: reduce) {
        body::before { animation: none; }
    }


    /* ==============================
       TYPOGRAPHY POLISH
       (only applies where a page doesn't already set its own value)
    ============================== */

    h1, h2, h3 {
        font-family: var(--pl-font-display), "Segoe UI", Arial, sans-serif;
        letter-spacing: -.02em;
    }


    /* ==============================
       CUSTOM SCROLLBAR
    ============================== */

    ::-webkit-scrollbar {
        width: 11px;
        height: 11px;
    }

    ::-webkit-scrollbar-track {
        background: #0a0d1c;
    }

    ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #7c3aed, #1d4ed8);
        border-radius: 20px;
        border: 2px solid #0a0d1c;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #a78bfa, #3b82f6);
    }

    * {
        scrollbar-width: thin;
        scrollbar-color: #7c3aed #0a0d1c;
    }

    ::selection {
        background: rgba(139, 92, 246, .45);
        color: #ffffff;
    }


    /* ==============================
       NAVBAR — glass + animated gradient + glow
    ============================== */

    .navbar {
        width: 100%;
        min-height: 68px;

        padding: 16px 40px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        background:
            linear-gradient(
                115deg,
                #1e1b4b,
                #312e81 22%,
                #1d4ed8 55%,
                #1e3a8a 85%,
                #1e1b4b
            );
        background-size: 250% 250%;
        animation: navGradientShift 14s ease infinite;

        color: white;

        position: sticky;
        top: 0;
        z-index: 100;

        border-bottom: 1px solid rgba(255,255,255,.08);
        box-shadow:
            0 8px 32px rgba(0,0,0,.45),
            0 1px 0 rgba(255,255,255,.06) inset;

        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
    }

    @keyframes navGradientShift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }


    .navbar-logo {
        display: flex;
        align-items: center;
        gap: 10px;

        font-family: var(--pl-font-display);
        font-size: 23px;
        font-weight: 900;
    }


    .navbar-logo-mark {
        width: 35px;
        height: 35px;

        border-radius: 10px;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
            linear-gradient(
                135deg,
                #8b5cf6,
                #1d4ed8
            );

        color: white;

        font-weight: 900;

        box-shadow:
            0 0 22px rgba(147,197,253,.55),
            0 0 0 1px rgba(255,255,255,.15) inset;

        position: relative;
        transition: transform .35s cubic-bezier(.2,.8,.3,1.2);
        transform-style: preserve-3d;
    }

    .navbar-logo:hover .navbar-logo-mark {
        transform: rotate(-10deg) scale(1.12);
        box-shadow:
            0 0 34px rgba(147,197,253,.85),
            0 0 0 1px rgba(255,255,255,.25) inset;
    }


    .navbar-subtitle {
        font-size: 12px;
        color: rgba(255,255,255,.8);
        letter-spacing: .02em;
    }


    /* ==============================
       NORMAL PAGE CONTAINER
    ============================== */

    .container {
        width: 100%;
        max-width: 1400px;

        margin: 0 auto;

        padding: 35px;

        animation: plPageIn .55s cubic-bezier(.16,.9,.3,1) both;
    }

    @keyframes plPageIn {
        from {
            opacity: 0;
            transform: translateY(14px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .container { animation: none; }
    }


    /* ==============================
       LOGIN / REGISTER PAGE
    ============================== */

    body:has(.login-page) {
        background: #070914;
        min-height: 100vh;
        overflow-x: hidden;
    }


    body:has(.login-page) .navbar {
        display: none;
    }


    body:has(.login-page) .container {
        width: 100%;
        max-width: none;

        margin: 0;
        padding: 0;

        min-height: 100vh;
    }


    /* ==============================
       REGISTER PAGE SUPPORT
    ============================== */

    body:has(.register-page) {
        background: #070914;
        min-height: 100vh;
        overflow-x: hidden;
    }


    body:has(.register-page) .navbar {
        display: none;
    }


    body:has(.register-page) .container {
        width: 100%;
        max-width: none;

        margin: 0;
        padding: 0;

        min-height: 100vh;
    }


    /* ==============================
       GLOBAL 3D HOVER PHYSICS
       Applies gentle lift + glow to any card-like
       or button-like element site-wide, additively —
       any property a page already defines simply wins.
    ============================== */

    [class*="card"],
    [class*="-stat"],
    [class*="stat-card"] {
        transition:
            transform .35s cubic-bezier(.2,.8,.2,1),
            box-shadow .35s ease,
            border-color .35s ease;
        will-change: transform;
    }

    [class*="card"]:hover,
    [class*="-stat"]:hover,
    [class*="stat-card"]:hover {
        transform: translateY(-5px);
    }

    button,
    [class*="btn"] {
        transition:
            transform .25s cubic-bezier(.2,.8,.3,1.1),
            box-shadow .25s ease,
            filter .25s ease;
    }

    button:hover,
    [class*="btn"]:hover {
        filter: brightness(1.08);
    }

    button:active,
    [class*="btn"]:active {
        transform: scale(.97);
    }

    a {
        transition: color .2s ease, opacity .2s ease;
    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 650px) {

        .navbar {
            padding: 14px 20px;
        }

        .navbar-subtitle {
            display: none;
        }

        .navbar-logo {
            font-size: 20px;
        }

        .container {
            padding: 20px;
        }

    }

</style>


</head>

<body>

<!-- PRICE LENS NAVBAR -->

<nav class="navbar">

    <div class="navbar-logo">

        <div class="navbar-logo-mark">
            P
        </div>

        <span>
            PriceLens
        </span>

    </div>


    <div class="navbar-subtitle">
        Cloud-Based E-Commerce Price Monitoring & Alert System
    </div>

</nav>


<!-- MAIN CONTENT -->

<main class="container">

    {% block content %}

    {% endblock %}

</main>

</body>

</html>
