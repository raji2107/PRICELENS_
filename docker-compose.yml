services:
  web:
    build: .
    container_name: pricelens_web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: pricelens
      DB_PASSWORD: pricelens123
      DB_NAME: pricelens
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: pricelens_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pricelens
      MYSQL_USER: pricelens
      MYSQL_PASSWORD: pricelens123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - pricelens_mysql_data:/var/lib/mysql

volumes:
  pricelens_mysql_data: